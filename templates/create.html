
{% extends 'base.html' %}

{% block content %}

    <h1>Create a New Item</h1>

    <form method="POST" class="mt-3">

        <div class="mb-3">

            <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Item Name"
                required
                maxlength="100"
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Create
        </button>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

{% endblock %}
